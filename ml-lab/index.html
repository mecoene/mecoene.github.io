<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ML Lab - Ene Meco</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-48.png" />
  <link rel="icon" type="image/png" sizes="96x96" href="/assets/favicon-96.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
  <meta name="theme-color" content="#070708" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;1,8..60,300&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <script>
    (() => {
      try {
        const savedTheme = localStorage.getItem('site-theme');
        const systemTheme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = savedTheme === 'light' || savedTheme === 'dark' ? savedTheme : systemTheme;
      } catch {
        document.documentElement.dataset.theme = 'dark';
      }
    })();
  </script>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="nav-inner">
      <ul class="nav-links" id="navLinks">
        <li><a href="/">About</a></li>
        <li><a href="/publications/">Projects</a></li>
        <li><a href="/ml-lab/" class="active">ML Lab</a></li>
        <li><a href="/cv/">CV</a></li>
      </ul>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to light mode" aria-pressed="false" title="Toggle light and dark mode">
        <span class="theme-toggle-track" aria-hidden="true">
          <span class="theme-toggle-thumb">
            <svg class="theme-toggle-icon" viewBox="0 0 24 24" focusable="false">
              <path class="theme-toggle-moon" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"></path>
              <path class="theme-toggle-slash" d="M5 19 19 5"></path>
            </svg>
          </span>
        </span>
        <span class="theme-toggle-text">Dark</span>
      </button>
      <button class="nav-toggle" id="navToggle" type="button" aria-label="Toggle menu" aria-controls="navLinks" aria-expanded="false">&#9776;</button>
    </div>
  </nav>

  <main class="container lab-container">
    <div class="page-hero lab-hero">
      <h1>ML Lab</h1>
      <p>Clustering &middot; Convolution &middot; kNN Upscaling</p>
    </div>

    <div class="lab-stack">
      <section class="lab-tool" aria-labelledby="clustering-title">
        <div class="lab-tool-header">
          <h2 id="clustering-title">Clustering Simulator</h2>
          <p class="lab-status" id="clusterStatus">0 points</p>
        </div>
        <div class="lab-workspace">
          <canvas class="lab-canvas cluster-canvas" id="clusterCanvas" width="640" height="420" aria-label="Interactive clustering canvas"></canvas>
          <div class="lab-controls">
            <label class="lab-field">
              <span>Algorithm</span>
              <select id="clusterAlgorithm">
                <option value="kmeans">K-Means</option>
                <option value="dbscan">DBSCAN</option>
                <option value="gmm">Gaussian Mixture</option>
              </select>
            </label>
            <label class="lab-field" id="clusterKField">
              <span>Clusters <output id="clusterKValue">3</output></span>
              <input id="clusterK" type="range" min="2" max="6" value="3" />
            </label>
            <label class="lab-field" id="clusterEpsField">
              <span>Radius <output id="clusterEpsValue">58</output></span>
              <input id="clusterEps" type="range" min="25" max="110" value="58" />
            </label>
            <label class="lab-field" id="clusterMinField">
              <span>Min points <output id="clusterMinValue">4</output></span>
              <input id="clusterMin" type="range" min="2" max="8" value="4" />
            </label>
            <div class="lab-button-row">
              <button class="lab-button" id="clusterSeed" type="button">Seed Points</button>
              <button class="lab-button lab-button-secondary" id="clusterClear" type="button">Clear</button>
            </div>
          </div>
        </div>
      </section>

      <section class="lab-tool" aria-labelledby="convolution-title">
        <div class="lab-tool-header">
          <h2 id="convolution-title">Convolution Visualizer</h2>
          <p class="lab-status" id="convStatus">3x3 kernel</p>
        </div>
        <div class="lab-workspace">
          <div class="lab-canvas-grid">
            <div>
              <p class="lab-panel-label">Input</p>
              <canvas class="lab-canvas conv-canvas" id="convSource" width="320" height="320" aria-label="Convolution input grid"></canvas>
            </div>
            <div>
              <p class="lab-panel-label">Output</p>
              <canvas class="lab-canvas conv-canvas" id="convOutput" width="320" height="320" aria-label="Convolution output grid"></canvas>
            </div>
          </div>
          <div class="lab-controls">
            <label class="lab-field">
              <span>Kernel</span>
              <select id="convKernel">
                <option value="blur">Blur</option>
                <option value="sharpen">Sharpen</option>
                <option value="edge">Edge Detection</option>
                <option value="sobel">Sobel Magnitude</option>
                <option value="emboss">Emboss</option>
                <option value="custom">Custom 3x3</option>
              </select>
            </label>
            <label class="lab-field">
              <span>Mix <output id="convMixValue">100%</output></span>
              <input id="convMix" type="range" min="0" max="100" value="100" />
            </label>
            <div class="kernel-grid" id="kernelGrid" aria-label="Kernel matrix"></div>
            <div class="lab-button-row">
              <button class="lab-button" id="convReset" type="button">Reset Grid</button>
            </div>
          </div>
        </div>
      </section>

      <section class="lab-tool" aria-labelledby="knn-title">
        <div class="lab-tool-header">
          <h2 id="knn-title">kNN Photo Upscaler</h2>
          <p class="lab-status" id="knnStatus">Sample image</p>
        </div>
        <div class="lab-workspace">
          <div class="lab-canvas-grid">
            <div>
              <p class="lab-panel-label">Source</p>
              <canvas class="lab-canvas image-canvas" id="knnSource" width="96" height="96" aria-label="Source image"></canvas>
            </div>
            <div>
              <p class="lab-panel-label">Upscaled</p>
              <canvas class="lab-canvas image-canvas" id="knnOutput" width="288" height="288" aria-label="kNN upscaled image"></canvas>
            </div>
          </div>
          <div class="lab-controls">
            <input class="file-input" id="knnUpload" type="file" accept="image/*" />
            <label class="lab-button file-button" for="knnUpload">Upload Photo</label>
            <label class="lab-field">
              <span>Neighbors <output id="knnValue">5</output></span>
              <input id="knnNeighbors" type="range" min="1" max="16" value="5" />
            </label>
            <label class="lab-field">
              <span>Scale</span>
              <select id="knnScale">
                <option value="2">2x</option>
                <option value="3" selected>3x</option>
                <option value="4">4x</option>
              </select>
            </label>
            <div class="lab-button-row">
              <button class="lab-button lab-button-secondary" id="knnSample" type="button">Sample</button>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Ene Meco &middot; Hosted on <a href="https://pages.github.com/" target="_blank">GitHub Pages</a></p>
  </footer>

  <script src="/scripts/site.js" defer></script>
  <script src="/scripts/ml-lab.js" defer></script>
  <script>
  if (window.location.pathname.endsWith('/ml-lab/index.html')) {
      window.history.replaceState(
          {},
          '',
          window.location.pathname.replace('/ml-lab/index.html', '/ml-lab/') +
          window.location.search +
          window.location.hash
      );
  }
  </script>
</body>
</html>
